<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="Four stage pipeline: capture, transcribe, summarize, export, all inside the Mac"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1c1b2e}.t{font-size:15px;font-weight:600}.s{font-size:13px;fill:#5b5a72}.h{font-size:11px;letter-spacing:1.5px;fill:#4f46e5;font-weight:700}.b{fill:#fff;stroke:#c9c7e0;stroke-width:1.5}.a{fill:#eef0ff;stroke:#4f46e5;stroke-width:2}.w{fill:#fff4e5;stroke:#e08a00;stroke-width:2}.l{stroke:#4f46e5;stroke-width:2;fill:none}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker></defs>
<rect width="800" height="300" rx="16" fill="#fafaff"/>
<rect x="16" y="16" width="768" height="268" rx="14" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="32" y="42" class="h">EVERYTHING BELOW STAYS ON YOUR MAC</text>
<g class="b"><rect x="36" y="80" width="150" height="110" rx="12"/><rect x="214" y="80" width="150" height="110" rx="12"/><rect x="392" y="80" width="150" height="110" rx="12"/><rect x="570" y="80" width="150" height="110" rx="12"/></g>
<text x="111" y="112" text-anchor="middle" class="h">1 CAPTURE</text><text x="111" y="140" text-anchor="middle" class="t">Audio</text><text x="111" y="162" text-anchor="middle" class="s">mic + system sound</text><text x="111" y="180" text-anchor="middle" class="s">to a 16 kHz stream</text>
<text x="289" y="112" text-anchor="middle" class="h">2 TRANSCRIBE</text><text x="289" y="140" text-anchor="middle" class="t">Speech model</text><text x="289" y="162" text-anchor="middle" class="s">Whisper, Parakeet,</text><text x="289" y="180" text-anchor="middle" class="s">Apple Speech</text>
<text x="467" y="112" text-anchor="middle" class="h">3 SUMMARIZE</text><text x="467" y="140" text-anchor="middle" class="t">Language model</text><text x="467" y="162" text-anchor="middle" class="s">Ollama, LM Studio,</text><text x="467" y="180" text-anchor="middle" class="s">MLX on localhost</text>
<text x="645" y="112" text-anchor="middle" class="h">4 EXPORT</text><text x="645" y="140" text-anchor="middle" class="t">Notes file</text><text x="645" y="162" text-anchor="middle" class="s">Markdown on disk,</text><text x="645" y="180" text-anchor="middle" class="s">opens in any editor</text>
<path class="l" marker-end="url(#m)" d="M188 135H210"/><path class="l" marker-end="url(#m)" d="M366 135H388"/><path class="l" marker-end="url(#m)" d="M544 135H566"/>
<text x="289" y="222" text-anchor="middle" class="s">audio in, text out</text><text x="467" y="222" text-anchor="middle" class="s">text in, notes out</text>
<text x="400" y="262" text-anchor="middle" class="s">Two different models. Passing one stage tells you nothing about the others.</text>
</svg>

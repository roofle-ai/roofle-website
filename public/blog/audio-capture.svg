<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Your microphone and system audio from the call app are mixed into one stream for the speech model"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1c1b2e}.t{font-size:15px;font-weight:600}.s{font-size:13px;fill:#5b5a72}.h{font-size:11px;letter-spacing:1.5px;fill:#4f46e5;font-weight:700}.b{fill:#fff;stroke:#c9c7e0;stroke-width:1.5}.a{fill:#eef0ff;stroke:#4f46e5;stroke-width:2}.w{fill:#fff4e5;stroke:#e08a00;stroke-width:2}.l{stroke:#4f46e5;stroke-width:2;fill:none}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker></defs>
<rect width="800" height="320" rx="16" fill="#fafaff"/>
<text x="32" y="40" class="h">WHAT THE SPEECH MODEL ACTUALLY HEARS</text>
<g class="b"><rect x="32" y="70" width="190" height="80" rx="12"/><rect x="32" y="190" width="190" height="80" rx="12"/></g>
<text x="127" y="104" text-anchor="middle" class="t">Your microphone</text><text x="127" y="126" text-anchor="middle" class="s">your voice</text>
<text x="127" y="224" text-anchor="middle" class="t">System audio</text><text x="127" y="246" text-anchor="middle" class="s">Zoom, Meet, Teams: other people</text>
<rect x="300" y="120" width="170" height="80" rx="12" class="a"/><text x="385" y="154" text-anchor="middle" class="t">Mix + resample</text><text x="385" y="176" text-anchor="middle" class="s">one mono stream</text>
<rect x="548" y="120" width="220" height="80" rx="12" class="a"/><text x="658" y="154" text-anchor="middle" class="t">Speech model</text><text x="658" y="176" text-anchor="middle" class="s">text with timestamps</text>
<path class="l" marker-end="url(#m)" d="M224 110C262 110 262 150 296 150"/><path class="l" marker-end="url(#m)" d="M224 230C262 230 262 170 296 170"/><path class="l" marker-end="url(#m)" d="M472 160H544"/>

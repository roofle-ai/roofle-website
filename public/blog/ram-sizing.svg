<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" role="img" aria-label="Rough guide of which language model size fits which unified memory tier on a Mac"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#1c1b2e}.t{font-size:15px;font-weight:600}.s{font-size:13px;fill:#5b5a72}.h{font-size:11px;letter-spacing:1.5px;fill:#4f46e5;font-weight:700}.b{fill:#fff;stroke:#c9c7e0;stroke-width:1.5}.a{fill:#eef0ff;stroke:#4f46e5;stroke-width:2}.w{fill:#fff4e5;stroke:#e08a00;stroke-width:2}.l{stroke:#4f46e5;stroke-width:2;fill:none}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4f46e5"/></marker></defs>
<rect width="800" height="380" rx="16" fill="#fafaff"/>
<text x="32" y="40" class="h">WHICH SUMMARY MODEL FITS YOUR MAC (ROUGH GUIDE)</text>
<g class="s"><text x="40" y="100">8 GB</text><text x="40" y="160">16 GB</text><text x="40" y="220">24 to 32 GB</text><text x="40" y="280">48 GB and up</text></g>
<g fill="#c7cbff"><rect x="150" y="78" width="120" height="32" rx="6"/></g>
<g fill="#9aa2ff"><rect x="150" y="138" width="250" height="32" rx="6"/></g>
<g fill="#6f78f5"><rect x="150" y="198" width="380" height="32" rx="6"/></g>
<g fill="#4f46e5"><rect x="150" y="258" width="600" height="32" rx="6"/></g>
<g class="t" style="fill:#1c1b2e"><text x="278" y="100">1 to 3B</text><text x="408" y="160">7 to 8B</text><text x="538" y="220">12 to 14B</text></g>
<text x="758" y="326" text-anchor="end" class="t" style="fill:#4f46e5">30B+</text>
<text x="150" y="124" class="s">short calls, plain summaries</text><text x="150" y="184" class="s">the sweet spot for most people</text><text x="150" y="244" class="s">better owners and dates</text><text x="150" y="306" class="s" style="fill:#fff">slow to load, best nuance</text>
<text x="400" y="352" text-anchor="middle" class="s">4-bit quantized models. Leave 4 to 6 GB free for macOS, the speech model and your call app.</text>
